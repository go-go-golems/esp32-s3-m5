<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photo Timer 0071</title>
  <style>
    :root { --bg: #0f172a; --fg: #e2e8f0; --panel: #1e293b; --muted: #94a3b8; --accent: #0ea5e9; }
    body { margin: 0; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); background: radial-gradient(circle at 20% 0%, #1d3557, #0b1020 55%); }
    main { max-width: 980px; margin: 0 auto; padding: 18px; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 960px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card { background: color-mix(in oklab, var(--panel), transparent 8%); border: 1px solid #334155; border-radius: 10px; padding: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    button { border: 1px solid #334155; background: #0b1220; color: var(--fg); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    textarea { width: 100%; min-height: 280px; box-sizing: border-box; border-radius: 8px; border: 1px solid #334155; background: #050b16; color: var(--fg); padding: 8px; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Cardputer-ADV Photo Timer (0071)</h1>
    <div class="grid">
      <section class="card">
        <h2>Status</h2>
        <pre id="status">Loading...</pre>
        <div class="row">
          <button data-action="toggle">Start/Pause</button>
          <button data-action="next">Next Step</button>
          <button data-action="reset">Reset</button>
        </div>
      </section>
      <section class="card">
        <h2>Preset JSON</h2>
        <div class="row">
          <button id="fetchPresets">Fetch</button>
          <button id="savePresets">Save</button>
        </div>
        <textarea id="presets"></textarea>
      </section>
    </div>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const presetsEl = document.getElementById('presets');

    async function getStatus() {
      const r = await fetch('/api/status');
      const j = await r.json();
      statusEl.textContent = JSON.stringify(j, null, 2);
    }

    async function getPresets() {
      const r = await fetch('/api/presets');
      const txt = await r.text();
      try { presetsEl.value = JSON.stringify(JSON.parse(txt), null, 2); }
      catch (_) { presetsEl.value = txt; }
    }

    async function savePresets() {
      const body = presetsEl.value;
      const r = await fetch('/api/presets', { method: 'POST', body, headers: { 'content-type': 'application/json' } });
      const txt = await r.text();
      alert((r.ok ? 'Saved\n' : 'Save failed\n') + txt);
      await getStatus();
    }

    async function control(action) {
      await fetch('/api/control', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action })
      });
      await getStatus();
    }

    document.getElementById('fetchPresets').onclick = getPresets;
    document.getElementById('savePresets').onclick = savePresets;
    document.querySelectorAll('button[data-action]').forEach((b) => {
      b.onclick = () => control(b.getAttribute('data-action'));
    });

    getStatus();
    getPresets();
    setInterval(getStatus, 2000);
  </script>
</body>
</html>
