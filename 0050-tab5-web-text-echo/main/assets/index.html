<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab5 Text Echo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0b1220;
        color: #e5eefb;
      }
      body {
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(760px, 100%);
        background: #111a2e;
        border: 1px solid #22304f;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .hint {
        color: #9fb4d4;
        margin-bottom: 20px;
      }
      textarea {
        width: 100%;
        min-height: 140px;
        resize: vertical;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid #33476f;
        background: #0b1220;
        color: inherit;
        font: inherit;
        padding: 14px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 14px 0;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        background: #5b8cff;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      button.secondary {
        background: #2a3550;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      pre {
        margin: 0;
        border-radius: 12px;
        background: #0b1220;
        border: 1px solid #33476f;
        padding: 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9fb4d4;
        margin: 18px 0 8px;
      }
      .error {
        color: #ff8f8f;
        min-height: 1.2em;
        margin-top: 8px;
      }
      .status {
        color: #9fb4d4;
        font-size: 14px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Tab5 Text Echo</h1>
      <p class="hint">Connect to the Tab5 SoftAP, type text below, and press Submit. The firmware keeps the current value in RAM and returns it from the device.</p>

      <form id="echoForm">
        <textarea id="echoInput" maxlength="512" placeholder="Type something here..."></textarea>
        <div class="row">
          <button id="submitBtn" type="submit">Submit</button>
          <button id="clearBtn" class="secondary" type="button">Clear</button>
        </div>
      </form>

      <div id="error" class="error"></div>
      <div id="status" class="status">Loading...</div>

      <div class="label">Echoed text</div>
      <pre id="echoOutput">(empty)</pre>

      <div class="label">Device state</div>
      <pre id="stateOutput">(loading)</pre>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
