almanach_studio_version: 1
theme: minimal
paperWidth: 384
bodyScale: 1.18
feedLines: 8
blocks:
  - id: title-1
    type: title
    data:
      text: M5DIAL 3D PLANET
      subtitle: coarse Z-buffer renders + math
  - id: date-1
    type: date
    data:
      date: May 28, 2026
      day: Thursday
  - id: note-goal
    type: note
    data:
      label: Goal
      text: "Port the JSX PLANET scene to firmware as a real 3D renderer. Render triangles into a coarse logical target, use a full logical Z-buffer, then Bayer-quantize directly into the existing 2-bit black/red/blue/white framebuffer. UI text stays solid."
      author: ticket 0097
  - id: image-resolution
    type: image
    data:
      label: Render sweep
      src: data:image/png;base64,
      alt: Resolution comparison montage for 40, 60, 80, 120, and 240 logical pixels
      caption: "Left to right: 40x40, 60x60, 80x80, 120x120, 240x240. The 120x120 image best matches JSX pixelSize=2; 80x80 is the safer firmware start."
      height: 118
      fit: contain
      border: true
      grayscale: true
      thermalTone: normal
  - id: word-fb
    type: word
    data:
      word: 2-bit FB
      definition: "240x240x2 bits = 14,400 bytes. Four pixels per byte: black, warm red, cool blue, high white."
  - id: word-z
    type: word
    data:
      word: Z buffer
      definition: "80x80x16 bits = 12,800 bytes. 120x120x16 bits = 28,800 bytes. 240x240x16 bits = 115,200 bytes."
  - id: note-pipeline
    type: note
    data:
      label: Pipeline
      text: "mesh vertices -> camera transform -> perspective projection -> triangle rasterization -> logical Z-test -> Bayer 4x4 threshold -> 2-bit framebuffer block write -> solid UI overlay -> RGB565 scanline transfer"
      author: renderer3d
  - id: note-equations
    type: note
    data:
      label: Math
      text: "camera eye=(target.x+sin(a)*d, target.y+h, target.z+cos(a)*d). screen_x=(view_x*focal/view_z)*(W/2)+W/2. screen_y=-(view_y*focal/view_z)*(H/2)+H/2. depth=clamp((z-near)/(far-near))*65535."
      author: projection + depth
  - id: image-zbits
    type: image
    data:
      label: Z bits
      src: data:image/png;base64,
      alt: Z-buffer bit depth comparison
      caption: "8-bit and 16-bit look equivalent for sphere-only captures; keep 16-bit until the ring is stable."
      height: 102
      fit: contain
      border: true
      grayscale: true
      thermalTone: normal
  - id: note-choice
    type: note
    data:
      label: Recommendation
      text: "First firmware target: 80x80 logical, scale 3, uint16 Z, lat14/lon22 or lat18/lon28 sphere, split ring composition. Quality target: 120x120 logical, scale 2, uint16 Z. Do not allocate RGB framebuffers."
      author: design decision
  - id: quote-1
    type: quote
    data:
      text: "Use memory for visibility, not color. The color buffer is already 2-bit; the only large graphics buffer should be depth."
      author: 0097 renderer rule
