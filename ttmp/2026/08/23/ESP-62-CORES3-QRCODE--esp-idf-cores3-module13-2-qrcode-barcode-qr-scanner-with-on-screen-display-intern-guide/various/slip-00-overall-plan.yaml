almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: ESP-62-QRCODE
      preset: micro
    - w: 1fr
      text: PLAN
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: CoreS3 QRCode Scanner Build
    preset: h1
    lines: 3
- id: gap2
  type: space
  data:
    size: s
- id: summary
  type: text
  data:
    text: 'ESP-IDF firmware: CoreS3 + Module13.2 QRCode, decode barcodes/QR and show on screen. UART control + M5GFX display.'
    preset: body
- id: gap3
  type: space
  data:
    size: m
- id: planhead
  type: text
  data:
    text: PLAN
    preset: h2
- id: plan
  type: checks
  data:
    items:
    - P0 probe module on UART
    - P1 skeleton + display boot
    - P2 scanner driver (UART+I2C)
    - P3 on-screen UI (code+history)
    - P4 console commands + polish
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - PHASES
      - '5'
    - - NEXT
      - P0 probe module on UART
- id: r3
  type: rule
  data:
    weight: hair
- id: decide
  type: row
  data:
    cols:
    - w: 1fr
      text: SCAN FOR REF
      preset: caption
    - w: 120
      blocks:
      - id: qr
        type: qr
        data:
          value: https://github.com/manuel-micropython-ws/esp32-s3-m5
          size: 110
