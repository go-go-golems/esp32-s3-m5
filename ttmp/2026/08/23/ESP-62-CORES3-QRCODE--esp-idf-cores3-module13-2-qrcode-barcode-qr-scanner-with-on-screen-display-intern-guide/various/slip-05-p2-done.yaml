almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: ESP-62-QRCODE
      preset: micro
    - w: 1fr
      text: P2 DONE
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: Scanner Driver Builds
    preset: h1
    lines: 3
- id: gap2
  type: space
  data:
    size: s
- id: summary
  type: text
  data:
    text: Ported M14-Pro UART protocol to ESP-IDF; PI4IOE5V6408 power+TRIG; scan pump->queue; qr status probe console. Build
      clean.
    preset: body
- id: gap3
  type: space
  data:
    size: m
- id: did
  type: list
  data:
    marker: —
    lines: 2
    items:
    - qr_engine protocol port (exact bytes)
    - 'qr_module: expander+UART+pump'
    - qr status console probe
    - build clean 513KB
- id: gap4
  type: space
  data:
    size: s
- id: tricky
  type: list
  data:
    marker: '!'
    lines: 2
    items:
    - unique_ptr needs complete type in header
    - xQueueOverwrite needs depth-1 queue
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - COMMIT
      - bd0e0a5b
    - - NEXT
      - P3 on-screen UI (code+history)
- id: r3
  type: rule
  data:
    weight: hair
- id: decide
  type: row
  data:
    cols:
    - w: 1fr
      text: SCAN FOR COMMIT
      preset: caption
    - w: 120
      blocks:
      - id: qr
        type: qr
        data:
          value: https://github.com/go-go-golems/esp32-s3-m5/commit/bd0e0a5b
          size: 110
