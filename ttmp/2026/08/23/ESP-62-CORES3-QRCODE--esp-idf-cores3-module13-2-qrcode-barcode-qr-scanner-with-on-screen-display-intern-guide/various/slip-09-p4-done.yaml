almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: ESP-62-QRCODE
      preset: micro
    - w: 1fr
      text: P4 DONE
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: Console + Polish Builds
    preset: h1
    lines: 3
- id: gap2
  type: space
  data:
    size: s
- id: summary
  type: text
  data:
    text: Full qr console (start/stop/mode/light/brightness/beep/reset) + README. Fullclean build reproducible to 515KB. All
      build phases done.
    preset: body
- id: gap3
  type: space
  data:
    size: m
- id: did
  type: list
  data:
    marker: —
    lines: 2
    items:
    - 'engine: factoryReset/beep/brightness'
    - full qr console subcommands + usage
    - README (build/flash/use)
    - fullclean rebuild byte-identical
- id: gap4
  type: space
  data:
    size: s
- id: tricky
  type: list
  data:
    marker: '!'
    lines: 2
    items:
    - fullclean drops managed_components (lock re-fetch)
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - COMMIT
      - 52d01d75
    - - NEXT
      - flash on hw once cdc_acm loaded
- id: r3
  type: rule
  data:
    weight: hair
- id: decide
  type: row
  data:
    cols:
    - w: 1fr
      text: SCAN FOR COMMIT
      preset: caption
    - w: 120
      blocks:
      - id: qr
        type: qr
        data:
          value: https://github.com/go-go-golems/esp32-s3-m5/commit/52d01d75
          size: 110
